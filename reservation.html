<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réservation | Flat Hôtel Fakal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
html{
    scroll-behavior:smooth;
}
body{
    min-height:100vh;
    font-family:'Montserrat',sans-serif;
    background:
        linear-gradient(rgba(10,18,35,.72),rgba(10,18,35,.72)),
        url("images/Table-dans-un-restaurant-sombre.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    padding:35px 15px;
    color:#222;
}
/* CONTENEUR PRINCIPAL */
form{
    width:100%;
    max-width:850px;
    margin:auto;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}
/* ENTÊTE */
.form-header{
    background:
        linear-gradient(rgba(10,25,45,.82),rgba(10,25,45,.82)),
        url("images/Table-dans-un-restaurant-sombre.jpg");
    background-size:cover;
    background-position:center;
    padding:45px 30px;
    text-align:center;
    color:white;
}
.form-header a{
    display:inline-block;
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    border:1px solid rgba(255,255,255,.5);
    padding:10px 20px;
    border-radius:30px;
    transition:.3s;
    margin-bottom:25px;
}
.form-header a:hover{
    background:white;
    color:#17263c;
}
.form-header h1{
    font-family:'Playfair Display',serif;
    font-size:42px;
    letter-spacing:2px;
    margin-bottom:10px;
}
.form-header p{
    color:#d8dce2;
    font-size:14px;
}
/* CONTENU */
.form-body{
    padding:35px;
}
/* FIELDSETS */
fieldset{
    border:1px solid #e2e6eb;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
    background:#fafbfc;
}
legend{
    padding:8px 18px;
    border-radius:30px;
    background:#1d3557;
    color:white;
    font-size:14px;
    font-weight:600;
    letter-spacing:.5px;
}
/* GRILLE */
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}
.form-group{
    display:flex;
    flex-direction:column;
}
.form-group.full{
    grid-column:1/-1;
}
label{
    font-size:13px;
    font-weight:600;
    color:#344054;
    margin-bottom:8px;
}
input,
textarea,
select{
    width:100%;
    border:1px solid #d5dae1;
    border-radius:8px;
    padding:13px 14px;
    background:white;
    color:#222;
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    outline:none;
    transition:.3s;
}
textarea{
    min-height:100px;
    resize:vertical;
}
input:focus,
textarea:focus,
select:focus{
    border-color:#2a8c91;
    box-shadow:0 0 0 3px rgba(42,140,145,.12);
}
/* RADIO */
.radio-group{
    display:flex;
    gap:25px;
    align-items:center;
    flex-wrap:wrap;
}
.radio-option{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
}
.radio-option input{
    width:auto;
    accent-color:#2a8c91;
}
/* INFORMATIONS */
.info{
    margin-top:5px;
    padding:14px;
    background:#edf8f8;
    border-left:4px solid #2a8c91;
    border-radius:6px;
    color:#52606d;
    font-size:12px;
    line-height:1.6;
}
/* BOUTONS */
.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
}
button,
input[type="reset"]{
    min-width:180px;
    height:50px;
    border:none;
    border-radius:30px;
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}
button{
    background:#1d3557;
    color:white;
    box-shadow:0 8px 20px rgba(29,53,87,.25);
}
button:hover{
    background:#2a8c91;
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(42,140,145,.3);
}
input[type="reset"]{
    background:#f0f2f4;
    color:#344054;
}
input[type="reset"]:hover{
    background:#e2e5e8;
}
/* FOOTER */
.form-footer{
    text-align:center;
    padding:20px;
    background:#101a2b;
    color:#aeb7c5;
    font-size:12px;
}
.form-footer strong{
    color:white;
}
/* RESPONSIVE TABLETTE */
@media(max-width:700px){
    body{
        padding:20px 10px;
    }
    .form-header{
        padding:35px 20px;
    }
    .form-header h1{
        font-size:34px;
    }
    .form-body{
        padding:20px;
    }
    .form-grid{
        grid-template-columns:1fr;
    }
    .form-group.full{
        grid-column:auto;
    }
    fieldset{
        padding:20px 15px;
    }
}
/* RESPONSIVE MOBILE */
@media(max-width:480px){
    body{
        padding:0;
    }
    form{
        border-radius:0;
        min-height:100vh;
    }
    .form-header{
        padding:30px 18px;
    }
    .form-header h1{
        font-size:29px;
    }
    .form-header p{
        font-size:12px;
    }
    .form-body{
        padding:18px 12px;
    }
    fieldset{
        padding:20px 12px;
    }
    legend{
        font-size:12px;
        padding:7px 14px;
    }
    input,
    textarea,
    select{
        font-size:13px;
        padding:12px;
    }
    .buttons{
        flex-direction:column;
    }
    button,
    input[type="reset"]{
        width:100%;
    }
}
</style>
</head>
<body>
<form method="post"
      action="ajouterClient.php"
      enctype="multipart/form-data">
<!-- EN-TÊTE -->
<div class="form-header">
    <a href="index.html">
        ← RETOUR À L'ACCUEIL
    </a>
    <h1>RÉSERVATION</h1>
    <p>
        Réservez votre séjour au Flat Hôtel Fakal
    </p>
</div>
<div class="form-body">
<!-- INFORMATIONS PERSONNELLES -->
<fieldset>
<legend>Informations personnelles</legend>
<div class="form-grid">
<div class="form-group">
<label for="nom">
Nom
</label>
<input
    type="text"
    id="nom"
    name="txtnom"
    placeholder="Votre nom"
    maxlength="20"
    required>
</div>
<div class="form-group">
<label for="postnom">
Post-nom
</label>
<input
    type="text"
    id="postnom"
    name="txtpostnom"
    placeholder="Votre post-nom"
    maxlength="20"
    required>
</div>
<div class="form-group">
<label for="prenom">
Prénom
</label>
<input
    type="text"
    id="prenom"
    name="txtprenom"
    placeholder="Votre prénom"
    maxlength="20"
    required>
</div>
<div class="form-group">
<label for="sexe">
Sexe
</label>
<select
    id="sexe"
    name="txtsexe"
    required>
<option value="">
Sélectionner
</option>
<option value="Homme">
Homme
</option>
<option value="Femme">
Femme
</option>
</select>
</div>
<div class="form-group">
<label for="mail">
Adresse e-mail
</label>
<input
    type="email"
    id="mail"
    name="txtmail"
    placeholder="exemple@gmail.com"
    maxlength="30"
    required>
</div>
<div class="form-group">
<label for="tel">
Téléphone
</label>
<input
    type="tel"
    id="tel"
    name="txttel"
    placeholder="+243 XX XXX XX XX"
    maxlength="20"
    required>
</div>
<div class="form-group full">
<label for="adresse">
Adresse
</label>
<textarea
    id="adresse"
    name="txtadresse"
    placeholder="Votre adresse complète"
    maxlength="50"
    required></textarea>
</div>
</div>
</fieldset>
<!-- MODE DE RÉSERVATION -->
<fieldset>
<legend>Mode de réservation</legend>
<div class="form-grid">
<div class="form-group">
<label for="accompagnement">
Type d'accompagnement
</label>
<select
    id="accompagnement"
    name="txttype"
    required>
<option value="Aucun">
Aucun
</option>
<option value="En couple">
En couple
</option>
<option value="En famille">
En famille
</option>
</select>
</div>
<div class="form-group">
<label>
Animal de compagnie
</label>
<div class="radio-group">
<label class="radio-option">
<input
    type="radio"
    name="txtanimal"
    value="Oui"
    required>
Oui
</label>
<label class="radio-option">
<input
    type="radio"
    name="txtanimal"
    value="Non">
Non
</label>
</div>
</div>
<div class="form-group full">
<label for="categorie">
Catégorie de chambre
</label>
<input
    type="text"
    id="categorie"
    name="txtcategorie"
    maxlength="20"
    placeholder="Ex : Chambre Double S1"
    required>
<div class="info">
💡 Indiquez le nom ou la catégorie de la chambre
que vous souhaitez réserver.
</div>
</div>
<div class="form-group">
<label for="date_ar">
Date et heure d'arrivée
</label>
<input
    type="datetime-local"
    id="date_ar"
    name="txtdate_ar"
    required>
</div>
<div class="form-group">
<label for="date_de">
Date de départ
</label>
<input
    type="date"
    id="date_de"
    name="txtdate_de"
    required>
</div>
</div>
</fieldset>
<!-- BOUTONS -->
<div class="buttons">
<button
    type="submit"
    value="VALIDER">
    ✓ &nbsp; CONFIRMER LA RÉSERVATION
</button>
<input
    type="reset"
    value="ANNULER">
</div>
</div>
<!-- PIED DU FORMULAIRE -->
<div class="form-footer">
    <strong>Flat Hôtel Fakal</strong>
    <br>
    Votre confort, notre priorité.
</div>
</form>
</body>
</html>
